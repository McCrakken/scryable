name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Yarn 4 is vendored in .yarn/releases; corepack makes `yarn` resolve to it.
      - run: corepack enable

      - uses: actions/cache@v4
        with:
          # Yarn 4's global cache (enableGlobalCache defaults to true).
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --immutable

      # The API type-checks against @scryable/shared's built declarations and the generated Prisma client.
      - run: yarn workspace @scryable/shared build
      - run: yarn workspace @scryable/api db:generate
        env:
          # prisma.config.ts requires it; generate never connects.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: yarn typecheck
      - run: yarn lint

      - name: Expo doctor
        working-directory: apps/mobile
        run: npx expo-doctor
